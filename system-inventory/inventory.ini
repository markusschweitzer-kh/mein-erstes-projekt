# Ansible Inventory für System-Informationen
# Generiert aus ip-change.csv

[all:vars]
ansible_user=ansible
ansible_become=yes
ansible_become_method=sudo
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# RHEL/Oracle Linux Systeme
[rhel_systems]
itcopreq40.itc.ibm.com ansible_host=9.125.190.40
itcopreq41.itc.ibm.com ansible_host=9.125.190.41

itcopreq43.itc.ibm.com ansible_host=9.125.190.43
itcopreq44.itc.ibm.com ansible_host=9.125.190.44
itcopreq45.itc.ibm.com ansible_host=9.125.190.45
itcopreq50.itc.ibm.com ansible_host=9.125.190.50
itcopreq51.itc.ibm.com ansible_host=9.125.190.51
itcopreq52.itc.ibm.com ansible_host=9.125.190.52

itcopreq60.itc.ibm.com ansible_host=9.125.190.60
itcopreq61.itc.ibm.com ansible_host=9.125.190.61
itcopreq70.itc.ibm.com ansible_host=9.125.190.70
itcopreq80.itc.ibm.com ansible_host=9.125.190.80
itcopreq81.itc.ibm.com ansible_host=9.125.190.81
itcopreq82.itc.ibm.com ansible_host=9.125.190.82

# Ubuntu Systeme (falls vorhanden - bitte anpassen)
[ubuntu_systems]
# Beispiel: ubuntu-host.itc.ibm.com ansible_host=9.125.190.XX
itcopreq42.itc.ibm.com ansible_host=9.125.190.42

# SLES Systeme (falls vorhanden - bitte anpassen)
[sles_systems]
# Beispiel: sles-host.itc.ibm.com ansible_host=9.125.190.XX
itcopreq62.itc.ibm.com ansible_host=9.125.190.62

# Gruppierung nach OS-Familie
[redhat_family:children]
rhel_systems

[debian_family:children]
ubuntu_systems

[suse_family:children]
sles_systems

